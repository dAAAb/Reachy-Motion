<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reachy-Motion</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Reachy-Motion</h1>
    <p class="sub">邊聊邊動 — speech-driven motion for Reachy Mini</p>
  </header>

  <section class="modes" aria-label="Voice mode">
    <button data-mode="gpt-live"><b>GPT-Live-1</b><span>OpenAI · full duplex</span></button>
    <button data-mode="elevenlabs"><b>ElevenLabs v4</b><span>Agent · your voice</span></button>
    <button data-mode="taigi"><b>台語</b><span>Local · ASR → SARC → TTS</span></button>
    <button id="stop" class="stop">Stop</button>
  </section>
  <section class="motion" aria-label="Motion engine">
    <span class="motion-label">Motion</span>
    <button data-engine="recipe"><b>Recipe</b><span>cloud planner · simple detail</span></button>
    <button data-engine="flow"><b>Flow model</b><span>cloud planner · learned motion</span></button>
    <button data-engine="local"><b>All local</b><span>Binh's planner + flow model on your Mac</span></button>
  </section>
  <p id="motionDesc" class="status motion-desc"></p>
  <section class="server" aria-label="Mac motion server">
    <span class="dot" id="srvDot"></span>
    <div class="srv-text">
      <b>Mac motion server</b> <span id="srvState">looking…</span>
      <span class="hint" id="srvHint"></span>
    </div>
    <button id="srvBtn" hidden></button>
  </section>
  <p id="status" class="status">idle</p>
  <p id="needKeys" class="banner" hidden>Add your OpenAI API key (and ElevenLabs agent ID) under <b>Keys &amp; voices</b> below to start talking.</p>

  <main>
    <figure class="preview">
      <svg id="robot" viewBox="-110 -125 220 220" role="img" aria-label="Live pose preview">
        <g id="body"><ellipse cx="0" cy="62" rx="58" ry="22" class="base"/><rect x="-40" y="22" width="80" height="42" rx="18" class="torso"/></g>
        <g id="head">
          <line id="antR" x1="-22" y1="-38" x2="-22" y2="-88" class="ant"/>
          <line id="antL" x1="22" y1="-38" x2="22" y2="-88" class="ant"/>
          <rect x="-52" y="-42" width="104" height="70" rx="30" class="face"/>
          <circle cx="-19" cy="-8" r="11" class="eye"/><circle cx="19" cy="-8" r="11" class="eye"/>
        </g>
      </svg>
      <figcaption id="poseText">—</figcaption>
    </figure>

    <section class="log">
      <h2>Conversation &amp; gestures</h2>
      <ol id="events"></ol>
    </section>
  </main>

  <details class="config" id="configBox">
    <summary>Keys &amp; voices <span class="hint">stored only on this device</span></summary>
    <form id="configForm" autocomplete="off">
      <div id="configFields"></div>
      <p class="hint" id="configPath"></p>
      <div class="actions"><button type="submit">Save</button><span id="configMsg" class="hint"></span></div>
    </form>
  </details>
  <script src="/static/main.js"></script>
</body>
</html>
