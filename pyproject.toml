[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_motion"
version = "0.4.3"
description = "Live voice chat with Reachy Mini — the robot generates expressive motion from what is being said, in real time."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "reachy-mini>=1.10",
    # reachy-animation (Apache-2.0) is vendored in reachy_motion/vendor/: no git dependency, so the app store
    # (uv pip install of the Space) works on machines without git
    "numpy>=1.26",
    "scipy>=1.11",
    "soxr>=0.5",                       # streaming resampler (no clicks between chunks)
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
    # gesture planner only (chat completions). Voice modes speak their WebSockets directly, so we don't force
    # openai>=3.12 onto the robot's shared apps venv, where Pollen's conversation app pins openai 2.x.
    "openai>=1.50",
    "websockets>=13",
    "zeroconf>=0.130",                 # find the Mac's Taiwanese speech node on the LAN (mDNS)
]
keywords = ["reachy-mini-app", "motion-generation", "voice", "gpt-live", "elevenlabs", "taiwanese"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# reachy-motion-asr: standalone Breeze-ASR-26 on Apple Silicon (same pins as the AIRI lab server)
asr = ["mlx==0.32.3", "mlx-audio==0.4.3", "av>=14", "fastapi>=0.110", "uvicorn>=0.30", "python-multipart>=0.0.9",
       "huggingface-hub>=0.24", "opencc-python-reimplemented>=0.1.7"]
# "local" motion engine / reachy-motion-server planner: Binh Pham's fine-tuned planner on Apple Silicon
local = ["mlx-lm>=0.32"]
# reachy-motion-node (run on the Mac that hosts the Taiwanese models)
node = ["aiohttp>=3.9"]
# scripts/record_session.py: render a session in MuJoCo to MP4
record = ["reachy-mini[mujoco]>=1.10", "imageio-ffmpeg>=0.5", "pillow>=10",
          "reachy-animation @ git+https://github.com/pham-tuan-binh/reachy-animation@90e25b5773353213cffe18d915d0703ba04c083b"]

[project.scripts]
reachy-motion = "reachy_motion.main:cli"
reachy-motion-node = "reachy_motion.taigi_node:main"
reachy-motion-asr = "reachy_motion.asr_server:main"
reachy-motion-server = "reachy_motion.motion_server:main"

[project.entry-points."reachy_mini_apps"]
reachy_motion = "reachy_motion.main:ReachyMotion"

[project.urls]
Repository = "https://github.com/dAAAb/Reachy-Motion"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_motion*"]

[tool.setuptools.package-data]
reachy_motion = ["static/**/*", "prompts/*.txt", "vendor/reachy_animation/LICENSE", "vendor/reachy_animation/*.md"]

[tool.ruff]
line-length = 119
